apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p10-telemetry
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: default
  source:
    repoURL: https://github.com/ariellopezg/SA-GitOps-202200185.git
    targetRevision: main
    path: p10/charts/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=false, ServerSideApply=true]
