apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p10-traffic
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '4'
spec:
  project: default
  source:
    repoURL: https://github.com/ariellopezg/SA-GitOps-202200185.git
    targetRevision: main
    path: p10/charts/traffic
  destination:
    server: https://kubernetes.default.svc
    namespace: p10
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=false]
