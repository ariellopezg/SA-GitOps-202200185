apiVersion: v1
kind: ConfigMap
metadata:
  name: p10-loki
data:
  config.yaml: |
    {{- .Files.Get "config/loki.yaml" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: p10-tempo
data:
  config.yaml: |
    {{- .Files.Get "config/tempo.yaml" | nindent 4 }}
---
{{- range $component := list "loki" "tempo" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: p10-{{ $component }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $.Values.storageClass }}
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p10-{{ $component }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: p10-{{ $component }}}
  template:
    metadata:
      labels: {app: p10-{{ $component }}}
      annotations:
        checksum/config: {{ $.Files.Get (printf "config/%s.yaml" $component) | sha256sum }}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: {{ $component }}
          image: {{ index (index $.Values $component) "image" | quote }}
          args: ["-config.file=/conf/config.yaml"]
          {{- if eq $component "tempo" }}
          env:
            - {name: GOMEMLIMIT, value: 1536MiB}
          {{- end }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports:
            - {name: http, containerPort: {{ if eq $component "loki" }}3100{{ else }}3200{{ end }}}
            {{- if eq $component "tempo" }}
            - {name: otlp-grpc, containerPort: 4317}
            {{- end }}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 10
          resources:
            {{- if eq $component "tempo" }}
            {{- toYaml $.Values.tempo.resources | nindent 12 }}
            {{- else }}
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
            {{- end }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: p10-{{ $component }}}
        - name: config
          configMap: {name: p10-{{ $component }}}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: p10-{{ $component }}
spec:
  selector: {app: p10-{{ $component }}}
  ports:
    - {name: http, port: {{ if eq $component "loki" }}3100{{ else }}3200{{ end }}, targetPort: http}
    {{- if eq $component "tempo" }}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    {{- end }}
---
{{- end }}
