apiVersion: v1
kind: ServiceAccount
metadata:
  name: p10-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: p10-collector
  namespace: p10
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: p10-collector
  namespace: p10
subjects:
  - kind: ServiceAccount
    name: p10-collector
    namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: p10-collector
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: p10-collector
data:
  config.yaml: |
    {{- .Files.Get "config/collector.yaml" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p10-collector
spec:
  replicas: 1
  selector:
    matchLabels: {app: p10-collector}
  template:
    metadata:
      labels: {app: p10-collector}
      annotations:
        checksum/config: {{ .Files.Get "config/collector.yaml" | sha256sum }}
    spec:
      serviceAccountName: p10-collector
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: collector
          image: {{ .Values.collector.image | quote }}
          args: [--config=/conf/config.yaml]
          ports:
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8889}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
      volumes:
        - name: config
          configMap: {name: p10-collector}
---
apiVersion: v1
kind: Service
metadata:
  name: p10-collector
  labels: {app: p10-collector}
spec:
  selector: {app: p10-collector}
  ports:
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: metrics, port: 8889, targetPort: metrics}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: p10-collector
  labels: {release: p10-monitoring}
spec:
  selector:
    matchLabels: {app: p10-collector}
  endpoints:
    - port: metrics
      interval: 10s
      honorLabels: true
