server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
ingester:
  trace_idle_period: 10s
  max_block_duration: 5m
  max_block_bytes: 10485760
storage:
  trace:
    backend: local
    wal:
      path: /data/wal
    local:
      path: /data/blocks
compactor:
  compaction:
    block_retention: 168h
usage_report:
  reporting_enabled: false
