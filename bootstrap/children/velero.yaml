apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p9-velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 12.1.0
      helm:
        releaseName: velero
        valueFiles:
          - $values/backup/velero-values.yaml
    - repoURL: https://github.com/ariellopezg/SA-GitOps-202200185.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
