# Instalar Sealed Secrets para manejar secretos cifrados dentro de Git

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p9-sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  source:
    repoURL: https://github.com/bitnami-labs/sealed-secrets.git
    targetRevision: v0.40.0
    path: helm/sealed-secrets
    helm:
      releaseName: sealed-secrets
      parameters:
          # Define el nombre del controlador
        - name: fullnameOverride
          value: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
