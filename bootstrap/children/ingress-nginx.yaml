# Instala Ingress NGINX para recibir tráfico externo y
# dirigirlo a los servicios del clúster

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p9-ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  source:
    # Obtiene el chart ingress-nginx, versión 4.15.1
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      # Nombre de la instalación
      releaseName: ingress-nginx
      values: |
        controller:
          unhealthyPodEvictionPolicy: AlwaysAllow
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: ingress-nginx
                        app.kubernetes.io/instance: ingress-nginx
                        app.kubernetes.io/component: controller
                    topologyKey: kubernetes.io/hostname
      parameters:
          # Mantiene dos réplicas durante la prueba de drenaje
        - name: controller.replicaCount
          value: "2"
          # Expone el controlador mediante un balanceador de carga externo
        - name: controller.service.type
          value: LoadBalancer
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
