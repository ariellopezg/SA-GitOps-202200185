# Obligar a que cada contenedor declare recursos mínimos y máximos

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Exigir solicitudes y límites de recursos
    policies.kyverno.io/category: Recursos
    policies.kyverno.io/description: Evita cargas sin control de CPU o memoria.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-container-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - development
                - production
      validate:
        message: Cada contenedor debe declarar solicitudes y límites de CPU y memoria.
        foreach:
          - list: request.object.spec.[initContainers, containers][]
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"
