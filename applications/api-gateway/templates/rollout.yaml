# Define los Pods y la estrategia de canary

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "api-gateway.fullname" . }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  # Si HPA está desactivado, solo en ese caso asigna directamente replicaCount
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.rollout.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "api-gateway.selectorLabels" . | nindent 6 }}
  strategy:
    canary:
      # Identifica el Service de la versión estable
      stableService: {{ include "api-gateway.fullname" . }}
      # Identifica el Service de la versión nueva
      canaryService: {{ include "api-gateway.fullname" . }}-canary
      # Espera antes de retirar los Pods anteriores
      scaleDownDelaySeconds: {{ .Values.rollout.scaleDownDelaySeconds }}
      {{- if .Values.ingress.enabled }}
      trafficRouting:
        nginx:
          stableIngress: {{ include "api-gateway.fullname" . }}
      {{- end }}
      steps:
        # Recorre los tres pasos definidos en values.yaml
        {{- range .Values.rollout.steps }}
        - setWeight: {{ .weight }}    # Asigna el porcentaje: 20, 50 u 80
        - pause:
            duration: {{ .pause }}    # Espera 20s
        - analysis:                   # Inicia el analisis automático
            templates:
              - templateName: {{ include "api-gateway.fullname" $ }}-health
            args:
              - name: service-name
                value: {{ include "api-gateway.fullname" $ }}-canary.{{ $.Release.Namespace }}.svc.cluster.local
              - name: service-port
                value: {{ $.Values.service.port | quote }}
        {{- end }}
  template:
    metadata:
      labels:
        {{- include "api-gateway.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      {{- if .Values.resilience.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "api-gateway.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      securityContext:
        runAsNonRoot: true  # Obliga a ejecutar el contenedor con un usuario diferente de root
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: "{{ required "image.repository es obligatorio" .Values.image.repository }}:{{ required "image.tag es obligatorio" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "api-gateway.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secretName }}
          startupProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
