apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "comments-service.fullname" . }}-config
  labels:
    {{- include "comments-service.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "comments-service.fullname" . }}
  labels:
    {{- include "comments-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "comments-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "comments-service.fullname" . }}-canary
  labels:
    {{- include "comments-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "comments-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "comments-service.fullname" . }}-health
  labels:
    {{- include "comments-service.labels" . | nindent 4 }}
spec:
  args:
    - name: service-name
    - name: service-port
  metrics:
    - name: service-health
      initialDelay: {{ .Values.analysis.initialDelay }}
      interval: {{ .Values.analysis.interval }}
      count: {{ .Values.analysis.count }}
      failureLimit: {{ .Values.analysis.failureLimit }}
      successCondition: result.status == "ok"
      failureCondition: result.status != "ok"
      provider:
        web:
          url: "http://{{ print "{{ args.service-name }}" }}:{{ print "{{ args.service-port }}" }}{{ .Values.healthPath }}"
          timeoutSeconds: 5
          jsonPath: "{$}"
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "comments-service.fullname" . }}
  labels:
    {{- include "comments-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.rollout.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "comments-service.selectorLabels" . | nindent 6 }}
  strategy:
    canary:
      canaryService: {{ include "comments-service.fullname" . }}-canary
      maxSurge: {{ .Values.rollout.maxSurge | quote }}
      maxUnavailable: {{ .Values.rollout.maxUnavailable }}
      steps:
        {{- range .Values.rollout.steps }}
        - setWeight: {{ .weight }}
        - pause:
            duration: {{ .pause }}
        - analysis:
            templates:
              - templateName: {{ include "comments-service.fullname" $ }}-health
            args:
              - name: service-name
                value: {{ include "comments-service.fullname" $ }}-canary
              - name: service-port
                value: {{ $.Values.service.port | quote }}
        {{- end }}
  template:
    metadata:
      labels:
        {{- include "comments-service.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values.config | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: comments-service
          image: "{{ required "image.repository es obligatorio" .Values.image.repository }}:{{ required "image.tag es obligatorio" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "comments-service.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secretName }}
          startupProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "comments-service.fullname" . }}
  labels:
    {{- include "comments-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: {{ include "comments-service.fullname" . }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.cpuUtilization }}
{{- end }}

